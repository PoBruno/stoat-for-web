packages:
  - packages/client
  - packages/stoat.js
  - packages/stoat-api
  - packages/solid-livekit-components
allowBuilds:
  "@swc/core": true
  esbuild: true
minimumReleaseAgeExclude:
  - stoat-api
nodeLinker: isolated

# Override prettier because some of the submodules have ancient prettiers required
# Having multiple prettiers makes the vscode extension unpredictable
# Override solid-js because somewhere from 1.9.6 -> 1.9.14 breaks reactivity
# across dependencies.
# Override stoat-api to the packages/stoat-api submodule: the fork's backend adds
# types (e.g. ForumPost) that do not exist in the published package. Regenerate it
# with `curl localhost:14702/openapi.json > OpenAPI.json && pnpm build` in there.
# It has to be a submodule rather than a sibling directory, because `docker build`
# only sees this repo's context.
overrides:
  "prettier": "^3.8.1"
  "solid-js": "1.9.14"
  "stoat-api": "workspace:*"
strictPeerDependencies: false
